<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flight Wall split-flap</title>
<!--
  Flight Wall - split-flap board

  Serve from <config>/www/flightwall/splitflap.html, i.e.
  http://your-ha:8123/local/flightwall/splitflap.html

  Values are passed as URL parameters, so the page is a pure renderer with no
  Home Assistant knowledge of its own:

    ?r1=LH1117&r2=AIRBUS A321-231&r3=LUFTHANSA&r4=DUSSELDORF
    &r5=19:26 IN 34M&r6=11.300 FT&r7=346 KT&p=10

    r1..r7  row values, in label order
    p       progress, 0..cols, drives the bottom strip
    logo    optional airline IATA code, or a full image URL. Shown as a flap
            in the leftmost cell of the FLIGHT row, as carrier logos were on
            real Solari boards. Omit for a blank cell.
    l1..l8  optional label overrides, defaults are printed below
    cols    optional, board width in characters, default 16
    ms      optional, milliseconds per flap step. 12 to 2000; values above
            about 400 are only useful for checking the mechanism in slow
            motion. Default comes from the perf preset.
    laps    optional, extra full passes through the character set before a
            cell settles. 0 is the shortest path, 1 the second shortest.
            Default 1.
    perf    optional, high | mid | low. A preset for weaker tablets; any
            explicit parameter still overrides it. Default high.
              high  full run through the character set, extra lap, all effects
              mid   run-in capped at 12 steps, lite styling
              low   run-in capped at 6 steps, lite styling, slower cadence
    maxsteps optional, cap on how many flaps a cell makes. 0 is uncapped, and
            a capped cell starts partway round instead of from its previous
            character. This is the strongest performance lever there is.
    lite    optional, 1 trims painted effects for older tablets, default 0
    intro   optional, 0 disables the incoming-flight sequence, default 1
    hold    optional, ms the previous flight stays visible, default 900
    blink   optional, ms the INCOMING banner blinks, default 2200

  On load the board first restores the previous flight from localStorage, blinks
  a green FLIGHT INCOMING banner, and only then flaps over to the new values.
  The flaps therefore start from the previous letters rather than from blank,
  as they would on a real board. With no stored flight the sequence is skipped.

  Row labels are printed on the frame rather than set in flaps, which is how a
  real departure board does it.

  Open the file directly with no parameters to see a demo board.
-->
<style>
  :root {
    --gap: 0.34vh;
    /* Eight rows tall, and wide enough for the label column plus every cell. */
    --cell-h: min(9.6vh, calc(94vw / 13.4));
    --cell-w: calc(var(--cell-h) / 1.5);
    --label-w: calc(var(--cell-h) * 2.7);
    --board: #08090b;
    --flap: #1a1c21;
    --flap-lit: #23262c;
    --ink: #f4f3ef;
    --label: #8b9099;
    --amber: #ffc033;
    --seam: rgba(0, 0, 0, .65);
    --edge: rgba(255, 255, 255, .05);
    --lit: #35ff7a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--board);
    overflow: hidden;
    font-family: 'Roboto Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
  }

  #board {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--gap);
  }

  .line { display: flex; align-items: center; gap: calc(var(--cell-h) * 0.22); }

  .label {
    width: var(--label-w);
    flex: 0 0 var(--label-w);
    text-align: right;
    font-size: calc(var(--cell-h) * 0.245);
    letter-spacing: .16em;
    line-height: 1.1;
    text-transform: uppercase;
    color: var(--label);
    user-select: none;
  }

  .row { display: flex; gap: calc(var(--gap) * 0.8); }

  .cell {
    position: relative;
    width: var(--cell-w);
    height: var(--cell-h);
    /* Perspective belongs on the cell, not the row. On the row its origin sits
       at the row's centre, so cells near the middle get almost no perspective
       and their rotation reads as a vertical squash rather than a fall. */
    perspective: calc(var(--cell-h) * 2.6);
    border-radius: calc(var(--cell-h) * 0.06);
    /* Isolate each cell so a flip cannot trigger layout or paint outside it.
       This is the single biggest win on low-powered tablets. */
    contain: layout paint style;
    overflow: hidden;
    background: var(--flap);
    box-shadow: inset 0 0 0 1px var(--edge);
  }

  /* Each half is a window onto a full-height glyph. The top window shows the
     upper part, the bottom window the lower part of the same character, which
     is what produces the seam across the middle of every flap. */
  .half {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    background: var(--flap);
    backface-visibility: hidden;
  }

  .half > span {
    position: absolute;
    left: 0;
    width: 100%;
    height: var(--cell-h);
    line-height: var(--cell-h);
    text-align: center;
    font-size: calc(var(--cell-h) * 0.62);
    font-weight: 500;
    color: var(--ink);
    user-select: none;
  }

  .top    { top: 0; border-bottom: 1px solid var(--seam); }
  .bottom { bottom: 0; }
  .top > span    { top: 0; }
  .bottom > span { top: -100%; }

  /* The two animating leaves sit above the static halves during a flip. */
  .leaf-top {
    top: 0;
    transform-origin: bottom center;
    z-index: 3;
    border-bottom: 1px solid var(--seam);
    background: var(--flap-lit);
  }
  .leaf-bottom {
    bottom: 0;
    transform-origin: top center;
    z-index: 3;
    transform: rotateX(90deg);
    background: var(--flap-lit);
    animation-fill-mode: backwards;
  }
  .leaf-top > span    { top: 0; }
  .leaf-bottom > span { top: -100%; }

  /* A real flap falls in two beats: the upper leaf drops away, and only then
     does the lower leaf swing up into place. Running both across the whole
     step reads as a fold rather than a fall. */
  .flip-a .leaf-top    { animation: fall-a calc(var(--dur) * .52) cubic-bezier(.5,0,.9,.55) forwards; }
  .flip-a .leaf-bottom { animation: rise-a calc(var(--dur) * .48) cubic-bezier(.2,.7,.4,1) forwards;
                         animation-delay: calc(var(--dur) * .52); }
  .flip-b .leaf-top    { animation: fall-b calc(var(--dur) * .52) cubic-bezier(.5,0,.9,.55) forwards; }
  .flip-b .leaf-bottom { animation: rise-b calc(var(--dur) * .48) cubic-bezier(.2,.7,.4,1) forwards;
                         animation-delay: calc(var(--dur) * .52); }

  /* Two identical pairs under different names. Alternating between them
     restarts the animation without the forced reflow a single name needs. */
  @keyframes fall-a { 0% { transform: rotateX(0deg); }  100% { transform: rotateX(-90deg); } }
  @keyframes rise-a { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0deg); } }
  @keyframes fall-b { 0% { transform: rotateX(0deg); }  100% { transform: rotateX(-90deg); } }
  @keyframes rise-b { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0deg); } }

  /* Shading is a static difference between the leaf faces rather than an
     animated filter. Animating filter forces a repaint on every frame. */
  .shade .leaf-top    { background: #15171b; }
  .shade .leaf-bottom { background: #262930; }

  #banner {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 9, 11, .55);
    z-index: 10;
    pointer-events: none;
  }
  #banner.on { display: flex; }
  #banner span {
    font-family: 'Roboto Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
    font-size: calc(var(--cell-h) * 0.72);
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--lit);
    text-shadow: 0 0 calc(var(--cell-h) * 0.35) rgba(53, 255, 122, .55);
    animation: blink .42s steps(1, end) infinite;
  }
  @keyframes blink { 0%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }

  /* Logo flap. Same two-leaf mechanism, an image instead of a glyph. */
  .cell.logo .half > img {
    position: absolute;
    left: 0;
    width: 100%;
    height: var(--cell-h);
    object-fit: contain;
    padding: 9%;
    filter: brightness(1.15) saturate(1.4) contrast(1.1);
  }
  .cell.logo .top > img,
  .cell.logo .leaf-top > img    { top: 0; }
  .cell.logo .bottom > img,
  .cell.logo .leaf-bottom > img { top: -100%; }

  /* Estimated time is picked out in amber, as on a real departure board. */
  .line.est .label { color: var(--amber); opacity: .8; }
  .cell.est .half > span { color: var(--amber); }

  /* lite: fewer painted effects, for older tablets */
  .lite .cell { box-shadow: none; border-radius: 0; }
  .lite .half { border-bottom-color: rgba(0, 0, 0, .8); }
  .lite #banner span { text-shadow: none; }
  .lite .cell.logo .half > img { filter: none; }
  .noflip .leaf-top, .noflip .leaf-bottom { display: none; }

  .cell.bar .half > span { color: var(--lit); }
  .line.bar .label { color: var(--lit); opacity: .7; }
  .cell.idle .leaf-top, .cell.idle .leaf-bottom { display: none; }
</style>
</head>
<body>
<div id="board"></div>
<div id="banner"><span>Flight Incoming</span></div>

<script>
(function () {
  "use strict";

  var q = new URLSearchParams(location.search);
  var COLS = Math.max(8, Math.min(48, parseInt(q.get("cols"), 10) || 16));
  var PERF = (q.get("perf") || "high").toLowerCase();
  if (["high", "mid", "low"].indexOf(PERF) === -1) PERF = "high";
  // maxsteps is the real lever. A cell walking the whole 46-character set does
  // up to 45 steps; across 128 cells that is 5760 DOM updates per refresh
  // whether or not anything rotates. Capping it lets the cell start partway
  // round instead, so it still flaps, just for less long.
  // A flap is two beats: the upper leaf falls, then the lower one swings up.
  // Below roughly 120 ms per step the two blur into one event and the board
  // stops looking mechanical, so the presets favour fewer, slower flaps over
  // many fast ones. That is both more convincing and less work.
  //
  // All three presets run the same 300 ms step, which is where the mechanism
  // reads best. A slower step is also less work per second, so the step is not
  // what the presets trade away: they differ in maxsteps and in painted
  // effects, and a weaker tablet gets a board that settles sooner rather than
  // one that flaps faster.
  var PRESET = {
    high: { ms: 300, laps: 0, lite: false, flip: true, maxsteps: 14 },
    mid:  { ms: 300, laps: 0, lite: true,  flip: true, maxsteps: 8  },
    low:  { ms: 300, laps: 0, lite: true,  flip: true, maxsteps: 5  }
  }[PERF];

  // An explicit parameter always wins over the preset.
  function num(name, dflt, lo, hi) {
    var v = parseInt(q.get(name), 10);
    if (isNaN(v)) return dflt;
    return Math.max(lo, Math.min(hi, v));
  }

  var STEP = num("ms", PRESET.ms, 12, 2000);
  var INTRO = q.get("intro") !== "0";
  var HOLD  = Math.max(0, Math.min(5000, parseInt(q.get("hold"), 10) || 900));
  var BLINK = Math.max(0, Math.min(8000, parseInt(q.get("blink"), 10) || 2200));
  var STORE = "flightwall.previous";
  // lite=1 trims everything that costs paint time on weak tablets.
  var LITE  = q.get("lite") ? q.get("lite") === "1" : PRESET.lite;
  var LAPS  = num("laps", PRESET.laps, 0, 3);
  var FLIP  = q.get("flip") ? q.get("flip") === "1" : PRESET.flip;
  var MAXSTEPS = num("maxsteps", PRESET.maxsteps, 0, 200);

  // Alternating the two flip classes restarts the animation without forcing a
  // synchronous reflow, which at 128 cells was the main source of stutter.
  //
  // Which one ran last has to be remembered on the cell rather than read back
  // off the element. settle() strips both classes at the top of the same step,
  // so by the time this runs the classList no longer knows. Asking it put the
  // same class back every time, and since nothing between the two touches
  // style, the browser resolved one unchanged value and never restarted the
  // animation: only the very first flap of a run actually moved, and every
  // step after it snapped both halves over at once.
  function flipClass(c) {
    c.el.classList.remove("idle");
    c.flip = c.flip === "flip-a" ? "flip-b" : "flip-a";
    c.el.classList.remove(c.flip === "flip-a" ? "flip-b" : "flip-a");
    c.el.classList.add(c.flip);
  }

  // Flap order. A real board cycles through its physical sequence, so reaching
  // a late character takes visibly longer than an early one. That uneven timing
  // is most of what makes it read as mechanical rather than as a fade.
  var MAIN = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,-:/>()+";
  var BAR  = " \u00B7\u2588";
  var MAIN_SET = MAIN.split("");
  var BAR_SET  = BAR.split("");

  // Carrier logos a real board would carry on its drum. The new airline is
  // appended if it is not already here, so the flap always has somewhere to
  // land, and the previous one is kept so the run-in starts where it left off.
  var LOGO_CODES = ["LH", "BA", "DE", "DL"];

  var LABELS = ["FLIGHT", "AIRCRAFT", "AIRLINE", "TO",
                "ESTIMATED", "ALTITUDE", "AIRSPEED", "PROGRESS"];

  var LOGO_ROW = 0;   // FLIGHT row carries the carrier logo
  var EST_ROW  = 4;   // ESTIMATED row is picked out in amber
  var LOGO_PAD = "  "; // logo cell plus one blank, so text starts at cell 2

  function logoUrl(v) {
    if (!v) return "";
    if (v.indexOf("/") === 0 || v.indexOf("http") === 0) return v;
    return "https://images.kiwi.com/airlines/128/" + v.toUpperCase() + ".png";
  }

  var demo = {
    r1: "LH1117",
    r2: "AIRBUS A321-231",
    r3: "LUFTHANSA",
    r4: "DUSSELDORF",
    r5: "19:26 IN 34M",
    r6: "11.300 FT",
    r7: "346 KT",
    p: "10",
    logo: "LH"
  };

  var hasParams = q.has("r1") || q.has("r2") || q.has("r3");

  function param(k) {
    var v = q.get(k);
    if (v === null || v === undefined) v = hasParams ? "" : (demo[k] || "");
    return v;
  }

  function label(i) {
    var v = q.get("l" + (i + 1));
    return (v === null || v === "") ? LABELS[i] : v;
  }

  // Row 0 is indented so its text clears the logo flap and the gap after it.
  function rowText(idx, value) {
    return (idx === LOGO_ROW ? LOGO_PAD : "") + String(value || "");
  }

  function normalise(text, set) {
    var out = [];
    var up = String(text).toUpperCase();
    for (var i = 0; i < COLS; i++) {
      var ch = i < up.length ? up.charAt(i) : " ";
      if (set.indexOf(ch) === -1) ch = " ";
      out.push(ch);
    }
    return out;
  }

  function progressRow() {
    var n = parseInt(param("p"), 10);
    if (isNaN(n) || n < 0) n = 0;
    if (n > COLS) n = COLS;
    var s = "";
    for (var i = 0; i < COLS; i++) s += (i < n ? "\u2588" : "\u00B7");
    return s;
  }

  // The previous flight is kept in localStorage so the board can show it again
  // before flapping over, exactly as a real board still displays the last
  // departure until the new one rolls in.
  function readPrevious() {
    try {
      var raw = window.localStorage.getItem(STORE);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function writeCurrent() {
    try {
      var o = { p: param("p"), logo: param("logo") };
      ["r1", "r2", "r3", "r4", "r5", "r6", "r7"].forEach(function (k) { o[k] = param(k); });
      window.localStorage.setItem(STORE, JSON.stringify(o));
    } catch (e) { /* private mode, storage full: not worth failing over */ }
  }

  var previous = readPrevious();

  // The drum the logo flap turns through: blank, the stock carriers, whatever
  // was showing last time, and the airline now overhead.
  var LOGO_SET = [""];
  LOGO_CODES.concat([previous ? previous.logo : "", param("logo")]).forEach(function (code) {
    var url = logoUrl(code);
    if (url && LOGO_SET.indexOf(url) === -1) LOGO_SET.push(url);
  });

  if (!LITE) document.body.classList.add("shade");
  if (LITE) document.body.classList.add("lite");
  if (!FLIP) document.body.classList.add("noflip");

  var board = document.getElementById("board");
  var cells = [];

  function buildCell(kind) {
    var isBar = kind === "bar";
    var isLogo = kind === "logo";
    var cell = document.createElement("div");
    cell.className = "cell idle" + (isBar ? " bar" : "") + (isLogo ? " logo" : "");
    cell.style.setProperty("--dur", STEP + "ms");
    ["top", "bottom", "leaf-top", "leaf-bottom"].forEach(function (cls) {
      var half = document.createElement("div");
      half.className = "half " + cls;
      half.appendChild(document.createElement(isLogo ? "img" : "span"));
      if (!isLogo) half.lastChild.textContent = " ";
      cell.appendChild(half);
    });
    var faces = cell.querySelectorAll(".half > " + (isLogo ? "img" : "span"));
    return {
      el: cell,
      logo: isLogo,
      top: faces[0],
      bottom: faces[1],
      leafTop: faces[2],
      leafBottom: faces[3],
      set: isLogo ? LOGO_SET : (isBar ? BAR_SET : MAIN_SET),
      index: 0,
      target: 0,
      laps: LAPS,
      flip: null
    };
  }

  function buildLine(idx, text, isBar) {
    var isEst = idx === EST_ROW;
    var line = document.createElement("div");
    line.className = "line" + (isBar ? " bar" : "") + (isEst ? " est" : "");

    var lab = document.createElement("div");
    lab.className = "label";
    lab.textContent = label(idx);
    line.appendChild(lab);

    var row = document.createElement("div");
    row.className = "row";
    var chars = normalise(text, isBar ? BAR : MAIN);
    for (var i = 0; i < COLS; i++) {
      var wantsLogo = (idx === LOGO_ROW && i === 0);
      var c = buildCell(wantsLogo ? "logo" : (isBar ? "bar" : "char"));
      if (isEst) c.el.classList.add("est");
      c.target = wantsLogo ? c.set.indexOf(logoUrl(param("logo")))
                           : c.set.indexOf(chars[i]);
      if (c.target < 0) c.target = 0;
      c.col = i;
      c.row = idx;
      row.appendChild(c.el);
      cells.push(c);
    }
    line.appendChild(row);
    board.appendChild(line);
  }

  ["r1", "r2", "r3", "r4", "r5", "r6", "r7"].forEach(function (k, i) {
    buildLine(i, rowText(i, param(k)), false);
  });
  buildLine(7, progressRow(), true);

  // Put a character in place with no animation, used to restore the previous
  // flight before the sequence starts.
  function setInstant(c, value) {
    var i = c.set.indexOf(value);
    if (i < 0) i = 0;
    c.index = i;
    face(c, c.top, c.set[i]);
    face(c, c.bottom, c.set[i]);
  }

  function restorePrevious() {
    if (!previous) return false;
    var any = false;
    var keys = ["r1", "r2", "r3", "r4", "r5", "r6", "r7"];
    var idx = 0;
    cells.forEach(function (c) { c._row = Math.floor(idx++ / COLS); });
    cells.forEach(function (c) {
      var text;
      if (c._row < 7) {
        text = rowText(c._row, previous[keys[c._row]] || "");
      } else {
        var n = parseInt(previous.p, 10);
        if (isNaN(n) || n < 0) n = 0;
        if (n > COLS) n = COLS;
        text = "";
        for (var i = 0; i < COLS; i++) text += (i < n ? "\u2588" : "\u00B7");
      }
      var chars = normalise(text, c.set);
      if (chars[c.col] !== " ") any = true;
      setInstant(c, chars[c.col]);
    });
    var prevLogo = logoUrl(previous.logo);
    cells.forEach(function (c) {
      if (!c.logo) return;
      setInstant(c, prevLogo);
      if (prevLogo) any = true;
    });
    return any;
  }

  // One flap step: the outgoing top leaf falls away while the incoming bottom
  // leaf swings up, and the static halves are swapped underneath so the seam
  // never shows the wrong character.
  //
  // Every cell used to run its own setTimeout chain. At 128 cells and a step
  // every 76 ms that is well over a thousand timer callbacks a second, each
  // with its own style recalculation. One requestAnimationFrame loop now drives
  // all of them, so the work is batched into a single frame.

  function settle(c) {
    if (c.pending === null) return;
    face(c, c.bottom, c.pending);
    if (FLIP) {
      // Dropping the flip class alone is not enough: without "idle" the leaves
      // stay visible with no animation, so the top half keeps showing the old
      // character while the bottom half already shows the new one.
      c.el.classList.remove("flip-a", "flip-b");
      c.el.classList.add("idle");
    }
    c.pending = null;
  }

  function face(c, el, value) {
    if (c.logo) {
      el.src = value || "";
      el.style.visibility = value ? "visible" : "hidden";
    } else {
      el.textContent = value;
    }
  }

  function advance(c) {
    var next = (c.index + 1) % c.set.length;
    var cur = c.set[c.index];
    var nxt = c.set[next];

    if (FLIP) {
      face(c, c.leafTop, cur);
      face(c, c.leafBottom, nxt);
      face(c, c.bottom, cur);
      face(c, c.top, nxt);
      flipClass(c);
      c.pending = nxt;
    } else {
      face(c, c.top, nxt);
      face(c, c.bottom, nxt);
      c.pending = null;
    }
    c.index = next;
  }

  function finished(c) {
    if (c.index !== c.target) return false;
    if (c.laps > 0) { c.laps--; return false; }
    return true;
  }

  var active = [];

  function tick(now) {
    var alive = 0;
    for (var i = 0; i < active.length; i++) {
      var c = active[i];
      if (c === null) continue;
      if (now < c.due) { alive++; continue; }

      settle(c);
      if (finished(c)) { active[i] = null; continue; }

      advance(c);
      c.due = now + STEP;
      alive++;
    }
    if (alive > 0) requestAnimationFrame(tick);
    else requestAnimationFrame(function (t) {
      for (var j = 0; j < active.length; j++) if (active[j]) settle(active[j]);
    });
  }

  // With a step cap, a cell that would have to walk most of the set instead
  // jumps to a position MAXSTEPS before its target and walks in from there.
  // The run-in is still a real flap sequence, it just does not start from the
  // previous character when that character is far away.
  function shorten(c) {
    if (!MAXSTEPS) return;
    var len = c.set.length;
    var distance = (c.target - c.index + len) % len;
    var total = distance + c.laps * len;
    if (total <= MAXSTEPS) return;
    c.laps = 0;
    var startIndex = (c.target - MAXSTEPS % len + len) % len;
    setInstant(c, c.set[startIndex]);
  }

  function flapToNew() {
    var t0 = performance.now();
    cells.forEach(function (c) {
      c.pending = null;
      shorten(c);
      c.due = t0 + c.col * 52 + Math.random() * 90;
    });
    active = cells.slice();
    requestAnimationFrame(tick);
  }

  function start() {
    writeCurrent();
    var restored = INTRO && restorePrevious();
    if (!restored) { flapToNew(); return; }

    var banner = document.getElementById("banner");
    setTimeout(function () {
      banner.classList.add("on");
      setTimeout(function () {
        banner.classList.remove("on");
        flapToNew();
      }, BLINK);
    }, HOLD);
  }

  if (document.readyState === "complete") start();
  else window.addEventListener("load", start);
})();
</script>
</body>
</html>
