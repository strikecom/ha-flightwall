# Flight Wall - core entities
#
# Drop this file in <config>/packages/ and make sure packages are enabled in
# configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# Before this works, rename your Flightradar24 "flights in area" entity to
# sensor.flightradar24_flights_in_area (Settings -> Devices & Services ->
# Entities). The integration names it after your Home Assistant language, so
# hardcoding one name here would only work for English installs.

template:
  - trigger:
      - trigger: state
        entity_id: sensor.flightradar24_flights_in_area
      - trigger: homeassistant
        event: start
    sensor:
      # Picks the aircraft with the highest elevation angle, i.e. the one you
      # would actually see if you looked up. Sorting by ground distance alone
      # returns cruising traffic at 11 km altitude instead of the approach you
      # can hear overhead.
      - name: Flightwall Flight
        unique_id: flightwall_flight
        icon: mdi:airplane
        state: >
          {% set fl = state_attr('sensor.flightradar24_flights_in_area','flights') or [] %}
          {% set ns = namespace(best=none, score=-1) %}
          {% for f in fl %}
            {% if f.altitude is defined and f.distance is defined and (f.altitude | float(0)) > 500 %}
              {% set alt_m = f.altitude | float(0) * 0.3048 %}
              {% set dist_m = [f.distance | float(0) * 1000, 50] | max %}
              {% set elev = atan(alt_m / dist_m) %}
              {% if elev > ns.score %}
                {% set ns.score = elev %}
                {% set ns.best = f %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.best.callsign if ns.best else 'none' }}
        attributes:
          flight: >
            {% set fl = state_attr('sensor.flightradar24_flights_in_area','flights') or [] %}
            {% set ns = namespace(best=none, score=-1) %}
            {% for f in fl %}
              {% if f.altitude is defined and f.distance is defined and (f.altitude | float(0)) > 500 %}
                {% set alt_m = f.altitude | float(0) * 0.3048 %}
                {% set dist_m = [f.distance | float(0) * 1000, 50] | max %}
                {% set elev = atan(alt_m / dist_m) %}
                {% if elev > ns.score %}
                  {% set ns.score = elev %}
                  {% set ns.best = f %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.best }}

    binary_sensor:
      # delay_off keeps the display from flickering on and off between polls.
      # Raise it if you live near a busy airport and the screen cycles too much.
      - name: Flightwall Inbound
        unique_id: flightwall_inbound
        delay_off: "00:02:00"
        state: >
          {{ (state_attr('sensor.flightradar24_flights_in_area','flights') or []) | count > 0 }}

input_text:
  # Remembers the last callsign that was shown, so the same aircraft is not
  # displayed again while it is still crossing the zone.
  flightwall_shown:
    name: Flightwall Shown
    max: 255
    initial: "-"

input_select:
  # Switches the display style. Takes effect on the next popup, no restart
  # needed. Add it to any dashboard as a dropdown if you want to flip between
  # them without opening settings.
  flightwall_style:
    name: Flightwall Style
    options:
      - dot-matrix
      - split-flap
    initial: dot-matrix
    icon: mdi:view-dashboard-variant

  # Animation budget for the split-flap board. Lower it if the flaps stutter on
  # the tablet. "low" keeps the character cycling but drops the 3D flip, which
  # is where most of the GPU work is. Takes effect on the next popup.
  flightwall_perf:
    name: Flightwall Performance
    options:
      - high
      - mid
      - low
    initial: high
    icon: mdi:speedometer

# Every numeric helper below uses -1 for "leave it to the performance preset".
# That way the preset still means something once the helpers exist.
input_number:
  # Extra full passes through the character set before a cell settles.
  # 0 is the shortest path, so cells whose character has not changed never move.
  # 1 sends every cell all the way round once more, so the whole board moves.
  flightwall_laps:
    name: Flightwall Laps
    min: -1
    max: 3
    step: 1
    initial: -1
    mode: box
    icon: mdi:rotate-right

  # Hard cap on how many flaps a single cell makes. The strongest performance
  # lever there is: a capped cell starts partway round instead of walking the
  # whole character set.
  flightwall_maxsteps:
    name: Flightwall Max Steps
    min: -1
    max: 45
    step: 1
    initial: -1
    mode: box
    icon: mdi:stairs

  # Milliseconds per flap. Lower is faster and more frantic.
  flightwall_ms:
    name: Flightwall Step ms
    min: -1
    max: 300
    step: 1
    initial: -1
    mode: box
    icon: mdi:timer-outline

input_boolean:
  # The 3D flip itself. Off leaves the characters cycling in place, which is a
  # last resort for very weak hardware.
  flightwall_flip:
    name: Flightwall 3D Flip
    initial: true
    icon: mdi:rotate-3d-variant

  # The restore, blink and flap opening sequence.
  flightwall_intro:
    name: Flightwall Intro
    initial: true
    icon: mdi:play-box-outline

rest_command:
  # Fully Kiosk Browser remote administration. Requires the Plus licence.
  # Replace TABLET_IP and FULLY_PASSWORD, or delete this block entirely and
  # remove the rest_command action from the automation if you do not use Fully.
  tablet_stop_screensaver:
    url: "http://TABLET_IP:2323/?cmd=stopScreensaver&password=FULLY_PASSWORD&type=json"
    method: GET
